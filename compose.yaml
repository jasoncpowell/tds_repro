# SQL Server for the repro and the test suite.
#
#   docker compose up -d --wait
#
# Set MSSQL_PORT to use a host port other than 1433 (the app reads it too).
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # The image is amd64-only; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "some!Password"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -Q "SELECT 1" -b -o /dev/null
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
