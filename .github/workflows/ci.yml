name: CI

on:
  push:
  pull_request:
  schedule:
    # Weekly, to notice when ecto_sql master changes in a way the upstream
    # patches no longer apply to or pass on.
    - cron: "0 6 * * 1"

jobs:
  compare:
    name: >-
      ${{ matrix.check == 'upstream' && 'Released ecto_sql reproduces the bug' || 'Vendored fix passes' }}
      (Elixir ${{ matrix.beam.elixir }})
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        check: [upstream, fixed]
        beam:
          - elixir: "1.17.2"
            otp: "27"
          - elixir: "1.20.4"
            otp: "29"

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-CU26-GDR1-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "some!Password"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'some!Password' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 20s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.beam.otp }}
          elixir-version: ${{ matrix.beam.elixir }}

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
            _build_upstream
          key: mix-${{ matrix.check }}-${{ matrix.beam.elixir }}-${{ hashFiles('mix.lock', 'vendor/ecto_sql/**') }}

      - name: Check formatting
        if: matrix.check == 'fixed' && matrix.beam.elixir == '1.20.4'
        run: |
          mix deps.get
          mix format --check-formatted

      - name: Compare
        run: bin/compare ${{ matrix.check }}

      - name: Show test output
        if: failure()
        run: tail -n 200 tmp/compare/*.log

  upstream:
    name: Upstream patches pass on ecto_sql master (SQL Server 2019)
    runs-on: ubuntu-24.04

    services:
      mssql:
        # ecto_sql's own CI runs its Tds tests against 2019-latest and
        # 2022-latest. The 2019 image only has sqlcmd in /opt/mssql-tools.
        image: mcr.microsoft.com/mssql/server:2019-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "some!Password"
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'some!Password' -Q 'SELECT 1' -b -o /dev/null || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'some!Password' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s
          --health-timeout 5s
          --health-start-period 20s
          --health-retries 30

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"

      - name: Verify the patches against ecto_sql master
        run: bin/verify-upstream

      - name: Show test output
        if: failure()
        run: tail -n 200 tmp/verify-upstream/*.log

  compile-without-tds:
    # tds is an optional dependency of ecto_sql, and lib/ecto/adapters/tds.ex is
    # compiled in every installation, including ones without tds. ecto_sql's own
    # CI always has tds, so it cannot catch a Tds struct expanded in that file.
    name: Adapter compiles without tds
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20.4"

      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-compile-without-tds-1.20.4-${{ hashFiles('mix.lock', 'vendor/ecto_sql/**') }}

      - name: Compile the adapter without tds
        run: bin/compile-without-tds

      - name: Show compile output
        if: failure()
        run: tail -n 200 tmp/compile-without-tds/*.log
